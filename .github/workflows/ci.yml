name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Pushes and pull requests from branches in this repository run on the
# project's self-hosted runners (`rivet-linux`, and `rivet-intel-gpu` for the
# hardware job, which holds every Intel card of the host it lands on). Pull requests from forks always run on GitHub-hosted
# runners: self-hosted machines never execute unreviewed outside code.

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + lib tests (linux)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'rivet-linux' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build deps
        # Every audio, video and still-image codec is the workspace's own Rust
        # (crates/opus, mp3, vorbis, aac, ac3, dts, lossless, h26x, av1, vp8,
        # vp9, mpeg2, mpeg4, prores, png, jpeg, imagecodecs): nothing to build
        # or load for them, and no assembler (NASM) for any build.
        # flac, mkvtoolnix: Xiph's reference FLAC tool and MKVToolNix, black
        # boxes the lossless oracle tests compare against and mux with (they
        # fail rather than skip without them: RIVET_REQUIRE_LOSSLESS_ORACLES
        # below; Apple's ALAC reference is built in the next step).
        # faad: faad2's AAC decoder, a black box the AAC codec's encoder is
        # checked against (AAC_REQUIRE_FAAD below). libdca-utils: libdca's
        # `dcadec`, the same for the DTS encoder (DTS_REQUIRE_DCADEC).
        # mediainfo: MediaArea's MediaInfo, an independent reader of rivet's
        # MP4s (RIVET_REQUIRE_MEDIAINFO). No FFmpeg, in any form.
        # gcc/g++/make ship on the runner already.
        # MKVToolNix comes from its author's own repository: the distribution's
        # (82) does not read FLAC in MP4, which the lossless oracle needs.
        run: |
          sudo install -d /etc/apt/keyrings
          sudo curl -fsSLo /etc/apt/keyrings/gpg-pub-moritzbunkus.gpg https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg
          echo "deb [signed-by=/etc/apt/keyrings/gpg-pub-moritzbunkus.gpg] https://mkvtoolnix.download/ubuntu/ $(lsb_release -cs) main"             | sudo tee /etc/apt/sources.list.d/mkvtoolnix.list
          sudo apt-get update && sudo apt-get install -y flac mkvtoolnix faad libdca-utils mediainfo
          mkvmerge --version

      - name: Build Apple's alacconvert (the ALAC reference, a black box)
        # Apple's open-source ALAC release, pinned, built without reading it.
        run: echo "ALACCONVERT=$(crates/lossless/tools/build-alacconvert.sh "$RUNNER_TEMP/alac")" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (workspace, default features)
        run: cargo build --workspace --locked

      - name: Lib tests
        run: |
          cargo test -p rivet-codec      --lib --features serde --locked
          # rivet-codec's integration tests: the software encoders and decoders
          # end to end (odd sizes, AV1 / H.26x round trips, the native codecs in
          # their containers). The GPU ones build to nothing without their features.
          cargo test -p rivet-codec      --release --features serde --locked --tests
          # The GPU backends' pure unit tests (parameter layouts, property
          # sequences): dlopen FFI, so they build and run with no card.
          cargo test -p rivet-codec      --lib --features serde,qsv,nvidia,amd --locked
          cargo test -p rivet-container  --locked
          # Still images included: every format through rivet's own codecs,
          # AVIF through rivet's own AV1 encoder and decoder (always in the
          # chain), stills from a clip made by rivet's own H.264 encoder.
          cargo test -p rivet-transcoder --lib --features server,batch,ipc,thumbnail,image --locked
          cargo test -p rivet-h26x       --release --locked
          # The AAC codec (crates/aac): the encoder, the decoder, their shared
          # tables, and both against faad2's decoder (a black box; installed
          # above) — required here, not skipped. The ISO/IEC 14496-26
          # conformance streams run in the crate's own CI.
          AAC_REQUIRE_FAAD=1 cargo test -p rivet-aac --release --locked
          # The AC-3 / E-AC-3 decoder (crates/ac3): unit tests and the bundled
          # 5.1 vector (the full sweep needs RIVET_AC3_VECTORS, not set here).
          cargo test -p rivet-ac3 --release --locked
          # The DTS codec (crates/dts): round trips through its encoder, and the
          # encoder's streams against libdca's decoder (a black box) —
          # required here.
          DTS_REQUIRE_DCADEC=1 cargo test -p rivet-dts --release --locked
          # Opus, MPEG audio / MP3 and Vorbis (crates/opus, crates/mp3,
          # crates/vorbis), both ways: each crate's committed vectors, round
          # trips and spec tests. The downloaded conformance suites (the Opus
          # test vectors, ISO's MPEG audio sequences, Xiph's Vorbis vectors)
          # run in each crate's own CI.
          cargo test -p rivet-opus -p rivet-mp3 -p rivet-vorbis --release --locked
          # FLAC and ALAC (crates/lossless), both ways, against the flac CLI and
          # Apple's alacconvert — required here.
          RIVET_REQUIRE_LOSSLESS_ORACLES=1 cargo test -p rivet-lossless --release --locked
          # The clean-room video codecs (crates/prores, vp8, vp9, mpeg2, mpeg4):
          # each crate's committed vectors, round trips and spec tests. The
          # downloaded conformance suites run in each crate's own CI.
          cargo test -p rivet-prores -p rivet-vp8 -p rivet-vp9 -p rivet-mpeg2 -p rivet-mpeg4 --release --locked
          # AV1 (crates/av1): the committed AOM vectors bit-exact, the encoder
          # against its own reconstruction, the malformed-input property
          # tests. The full AOM set and the Argon suite run in its own CI.
          cargo test -p rivet-av1 --release --locked
          # The still-image codecs: WebP (crates/webp), PNG (crates/png; PngSuite and the DEFLATE
          # round trips, committed) and JPEG (crates/jpeg; its committed
          # corpus), and GIF, BMP and TIFF (crates/imagecodecs, a workspace of
          # its own with its own lock file).
          cargo test -p rivet-png -p rivet-jpeg -p rivet-webp --release --locked
          cargo test --manifest-path crates/imagecodecs/Cargo.toml --workspace --release --locked

      - name: Lossless audio against the reference encoders and decoders
        # FLAC / ALAC bit-exact both ways against the flac CLI and Apple's
        # alacconvert, through rivet's MP4 and Matroska code (mkvmerge).
        run: RIVET_REQUIRE_LOSSLESS_ORACLES=1 cargo test -p rivet-codec --release --locked --test lossless_oracle

      - name: End-to-end jobs on synthetic sources
        # Inputs made by rivet's own encoders (tests/common/synth.rs): fitted
        # geometry, DTS input, an HLS bitrate ladder, every audio codec in
        # every file it goes in (read back and decoded by rivet); and
        # MediaInfo reading rivet's MP4s and MKVToolNix rivet's WebMs
        # (required here); every video codec's output through the job
        # engine, demuxed and decoded by rivet with PSNR against the source
        # (software AV1 at 8 and 10 bits, VP9 profile 2 and VP9 / AV1
        # bitrate rungs among them); the AV1 PSNR / SSIM gate on the
        # software encoder.
        env:
          RIVET_REQUIRE_MEDIAINFO: "1"
          RIVET_REQUIRE_MKVTOOLNIX: "1"
        run: >-
          cargo test -p rivet-transcoder --release --locked --features h26x-fallback,av1-sw-fallback
          --test fit_e2e --test dts_audio --test hls_rates --test fidelity_mediainfo --test audio_codecs_e2e
          --test new_codecs_e2e --test fidelity_psnr_ssim

  msrv:
    name: MSRV (1.99)
    # The workspace's rust-version: every crate, the submodules included,
    # builds at it. The test job above runs on stable, which moves.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'rivet-linux' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - name: Check every crate and target at 1.99
        run: cargo check --workspace --all-targets --locked --features rivet-transcoder/server,rivet-transcoder/batch,rivet-transcoder/image

  h26x-arm64:
    name: h26x tests (linux arm64, NEON kernels)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: h26x tests
        # The NEON kernels are checked bit-exact against the scalar reference
        # here; the x86 job covers AVX2 the same way. h26x is pure Rust, so
        # no native build deps.
        run: cargo test -p rivet-h26x --release --locked

  intel-gpu:
    name: encode on Intel Arc (QSV)
    # Real hardware: only for trusted refs, never for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: rivet-intel-gpu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI with QSV
        run: cargo build -p rivet-transcoder --features qsv --locked

      - name: The runner's card is detected
        run: |
          ./target/debug/rivet devices --json | tee devices.json
          python3 -c "import json; d=json.load(open('devices.json')); g=d['gpus'] if isinstance(d,dict) else d; assert any(x.get('vendor','').lower().startswith('intel') or 'intel' in json.dumps(x).lower() for x in g), g"

      - name: A noisy 1080p source
        # Film-grain-like noise makes large frames: the case that once
        # overflowed the flush bitstream. Made by rivet's own H.264 encoder.
        run: >-
          cargo run --release -p rivet-transcoder --locked --example synth_clip --
          src.mp4 --size 1920x1080 --fps 30 --seconds 10 --noise 12 --bitrate 8000000

      - name: Encode AV1, H.264 and H.265 ladders on the card
        run: |
          for codec in av1 h264 h265; do
            ./target/debug/rivet transcode src.mp4 -o "out-$codec" --mode hls --codec "$codec"               --rung 1920x1080 --rung 1280x720 --encode family:intel
            test -n "$(find "out-$codec" -name '*.m4s' -size +1k -print -quit)"
            echo "$codec: $(du -sh "out-$codec" | cut -f1)"
          done

      - name: Constant-rate (CBR) encodes hold their rate on the card
        # AV1, H.264 and H.265 at rate=cbr through the job: the average within
        # 10% of the target, no one-second window over the rate plus the
        # buffer, and an HLS rendition's BANDWIDTH the declared rate plus the
        # audio. Required here: a skip is a failure on this runner.
        env:
          RIVET_REQUIRE_QSV: "1"
          TRANSCODE_ENCODER_BACKEND: qsv
        run: cargo test -p rivet-transcoder --features qsv --locked --test cbr_rates -- --nocapture --test-threads=1

      - name: VP9 on the card (QSV encode and decode against rivet's own VP9 decoder)
        # QSV VP9 encode, profile 0 and profile 2: every packet decodes in
        # rivet's own VP9 decoder, PSNR against the source, WebM / MP4 round
        # trips, QSV decode of its own stream bit-exact with rivet's, a CBR
        # rung holding its rate. Then QSV decode of rivet's own VP9 clips and
        # the WebM project's VP9 test vectors (4:2:0, 8 / 10-bit), bit-exact
        # with rivet's decoder through the VP9 guard; the bare decoder is also
        # run on the streams the guard keeps from it (RIVET_VPX_RAW_FEATURES)
        # and what it does there is printed — the evidence a guard policy is
        # relaxed on. Required: a skip is a failure on this runner.
        env:
          RIVET_REQUIRE_QSV: "1"
          RIVET_VPX_RAW_FEATURES: "1"
        run: |
          crates/vp9/tools/fetch-vectors.sh
          RIVET_VP9_VECTORS="$PWD/crates/vp9/tests/vectors" cargo test -p rivet-codec --release --features qsv --locked --no-fail-fast --test qsv_vp9_encode --test hw_vpx_decode -- --nocapture --test-threads=1

      - name: VP9 ladders through the CLI on the card
        run: |
          ./target/debug/rivet transcode src.mp4 -o out-vp9.webm --codec vp9 --rung 1280x720 --encode family:intel
          test "$(stat -c %s out-vp9.webm)" -gt 10000
          ./target/debug/rivet transcode src.mp4 -o out-vp9-hls --mode hls --codec vp9             --rung 1920x1080 --rung 1280x720 --encode family:intel
          test -n "$(find out-vp9-hls -name '*.m4s' -size +1k -print -quit)"
          ./target/debug/rivet transcode src.mp4 -o cbr-vp9-hls --mode hls --codec vp9             --rung 1280x720@2M --rate-mode cbr --encode family:intel
          grep BANDWIDTH cbr-vp9-hls/master.m3u8

      - name: Constant-rate ladders through the CLI
        run: |
          for codec in av1 h264 h265; do
            ./target/debug/rivet transcode src.mp4 -o "cbr-$codec" --mode hls --codec "$codec"               --rung 1920x1080 --rung 1280x720@2M --rate-mode cbr --encode family:intel
            grep BANDWIDTH "cbr-$codec/master.m3u8"
          done

      # ---- Every card on this host --------------------------------------
      # The runner holds all of its node's Intel cards (devbox: an Arc A380
      # and an Arc A750; vulpes-zerda: an Arc A310). Everything below reads
      # the count from `rivet devices --json` and runs on all of them; the
      # multi-card checks say "skipped" on a one-card host. drm_usage.py
      # records, from the i915 driver's per-client engine time, which cards
      # a command really used; check_decode reads every output back through
      # rivet's own software decoders.

      - name: Build the release CLI, the source maker and the decode checker
        run: >-
          cargo build --release -p rivet-transcoder --features qsv --locked
          --bin rivet --example synth_clip --example check_decode

      - name: Count the cards
        id: cards
        env:
          NO_COLOR: "1"
        run: |
          ls -l /dev/dri
          for b in /sys/bus/pci/devices/*; do
            case "$(cat "$b/class")" in 0x03*) echo "$(basename "$b") vendor=$(cat "$b/vendor") device=$(cat "$b/device") subsystem=$(cat "$b/subsystem_vendor"):$(cat "$b/subsystem_device")";; esac
          done
          ./target/release/rivet devices
          ./target/release/rivet devices --json > devices.json
          python3 .github/scripts/multi_gpu_check.py devices devices.json cards.json | tee -a "$GITHUB_OUTPUT"
          grep '^gpu ' <(python3 .github/scripts/multi_gpu_check.py devices devices.json cards.json) >> "$GITHUB_STEP_SUMMARY"
          ./target/release/examples/synth_clip src720.mp4 --size 1280x720 --fps 30 --seconds 10
          ./target/release/examples/synth_clip src1080.mp4 --size 1920x1080 --fps 30 --seconds 30 --noise 6 --bitrate 20000000

      - name: Each card, pinned, encodes AV1, H.264, H.265 and VP9
        # `--encode gpu:N --decode gpu:N`: the whole job on card N. The
        # kernel must see card N's video engines busy and no other card
        # touched; every output must decode, frame for frame, close to the
        # source.
        env: &all-cards
          NO_COLOR: "1"
          CARDS: ${{ steps.cards.outputs.cards }}
          RIVET: ./target/release/rivet
          CHECK: ./target/release/examples/check_decode
          USAGE: python3 .github/scripts/drm_usage.py
          ASSERT: python3 .github/scripts/multi_gpu_check.py
        run: |
          for gpu in $(python3 -c "import json; print(' '.join(sorted(json.load(open('cards.json')), key=int)))"); do
            for codec in av1 h264 h265 vp9; do
              ext=mp4; [ "$codec" = vp9 ] && ext=webm
              out="pin-$codec-gpu$gpu.$ext"
              $USAGE "usage-$codec-gpu$gpu.json" -- $RIVET transcode src720.mp4 -o "$out" --codec "$codec" \
                --rung 1280x720 --encode "gpu:$gpu" --decode "gpu:$gpu" 2> "pin-$codec-gpu$gpu.log" \
                || { tail -50 "pin-$codec-gpu$gpu.log"; exit 1; }
              $ASSERT pinned "usage-$codec-gpu$gpu.json" cards.json "$gpu"
              $CHECK "$out" --ref src720.mp4 --codec "$codec" --frames 300 --size 1280x720 --min-psnr 30
            done
          done

      - name: A ladder spreads across every card
        # The same three-rung AV1 HLS ladder on each card alone and on all of
        # them (`--encode family:intel`, the default decode plan). On all,
        # the ladder workers must log chunks done on every card and the
        # kernel must see every card's video engines busy. Every rendition
        # decodes, the full-size one close to the source.
        #
        # The times are printed, not asserted: devbox's two cards are far
        # apart (the A380 is on a PCIe 3.0 x2 chipset link, the A750 on the
        # CPU's 4.0 x16, so the A380 is 2-3.5x slower at 1080p), and the
        # default decode plan splits the source evenly across the cards, so
        # the slow card's share of the decode gates the job.
        env: *all-cards
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ladder="--mode hls --codec av1 --rung 1920x1080 --rung 1280x720 --rung 854x480"
          plans="$(python3 -c "import json; print(' '.join('gpu:'+i for i in sorted(json.load(open('cards.json')), key=int)))") family:intel"
          for plan in $plans; do
            tag="${plan/:/-}"
            $USAGE "usage-ladder-$tag.json" -- $RIVET transcode src1080.mp4 -o "ladder-$tag" $ladder --encode "$plan" \
              2> "ladder-$tag.log" || { tail -50 "ladder-$tag.log"; exit 1; }
            case "$plan" in gpu:*) $ASSERT pinned "usage-ladder-$tag.json" cards.json "${plan#gpu:}";; esac
            echo "ladder on $plan: $(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['wall_s'])" "usage-ladder-$tag.json")s" | tee -a "$GITHUB_STEP_SUMMARY"
            for p in $(find "ladder-$tag/video" -name '*.m3u8' | sort); do
              $CHECK "$p" --codec av1 --frames 900
            done
          done
          $ASSERT all usage-ladder-family-intel.json cards.json
          $ASSERT chunks ladder-family-intel.log cards.json
          full=$(awk '/RESOLUTION=1920x1080/{getline; print; exit}' ladder-family-intel/master.m3u8)
          test -n "$full"
          $CHECK "ladder-family-intel/$full" --ref src1080.mp4 --codec av1 --frames 900 --size 1920x1080 --min-psnr 30

      - name: When the encode is the bottleneck, all the cards beat the fastest one alone
        # The scheduler's claim, measured where it applies: the encoders at
        # `--video-speed archive` and the decode on the fastest card, so the
        # encode is the limit. The ladder on every card must take at most
        # 0.85x the fastest card's time alone (devbox: about 0.7x).
        env: *all-cards
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          wall() { python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['wall_s'])" "$1"; }
          fast=$(python3 -c "import json; c=json.load(open('cards.json')); print(min(c, key=lambda i: json.load(open(f'usage-ladder-gpu-{i}.json'))['wall_s']))")
          echo "the fastest card is $fast"
          for codec in av1 h265; do
            ladder="--mode hls --codec $codec --rung 1920x1080 --rung 1280x720 --rung 854x480 --video-speed archive --decode gpu:$fast"
            for plan in "gpu:$fast" family:intel; do
              tag="$codec-${plan/:/-}"
              $USAGE "usage-busy-$tag.json" -- $RIVET transcode src1080.mp4 -o "busy-$tag" $ladder --encode "$plan" \
                2> "busy-$tag.log" || { tail -50 "busy-$tag.log"; exit 1; }
            done
            $ASSERT pinned "usage-busy-$codec-gpu-$fast.json" cards.json "$fast"
            $ASSERT all "usage-busy-$codec-family-intel.json" cards.json
            $ASSERT chunks "busy-$codec-family-intel.log" cards.json
            $ASSERT faster "$codec archive ladder on all cards vs card $fast alone" \
              "$(wall "usage-busy-$codec-family-intel.json")" "$(wall "usage-busy-$codec-gpu-$fast.json")" 0.85 | tee -a "$GITHUB_STEP_SUMMARY"
            for p in $(find "busy-$codec-family-intel/video" -name '*.m3u8' | sort); do
              $CHECK "$p" --codec "$codec" --frames 900
            done
          done

      - name: Single-file ladders stitched from every card's chunks
        # Single-file output on several cards is chunk-and-stitch: each
        # rung's MP4 is GOP-sized chunks from all the cards, joined in order.
        # Every frame must decode, for each codec.
        env: *all-cards
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          for codec in av1 h264 h265; do
            $USAGE "usage-stitch-$codec.json" -- $RIVET transcode src1080.mp4 -o "stitch-$codec" --codec "$codec" \
              --rung 1920x1080 --rung 1280x720 --encode family:intel 2> "stitch-$codec.log" \
              || { tail -50 "stitch-$codec.log"; exit 1; }
            $ASSERT all "usage-stitch-$codec.json" cards.json
            $ASSERT chunks "stitch-$codec.log" cards.json
            ls -l "stitch-$codec"
            test "$(ls "stitch-$codec"/*.mp4 | wc -l)" = 2
            for f in "stitch-$codec"/*.mp4; do $CHECK "$f" --codec "$codec" --frames 900; done
          done

      - name: One job per card, all at once
        # Independent jobs, each pinned to its own card, run side by side:
        # each must stay on its card, every output must decode, and none may
        # be slowed by the others (at most 1.15x its time alone): the cards
        # are independent.
        env: *all-cards
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gpus=$(python3 -c "import json; print(' '.join(sorted(json.load(open('cards.json')), key=int)))")
          job() { $USAGE "usage-$2.json" -- $RIVET transcode src1080.mp4 -o "$2.mp4" --codec h265 --rung 1920x1080 \
                    --encode "gpu:$1" --decode "gpu:$1" 2> "$2.log"; }
          for n in $gpus; do job "$n" "alone-$n" || { tail -50 "alone-$n.log"; exit 1; }; done
          pids=""
          for n in $gpus; do job "$n" "together-$n" & pids="$pids $!"; done
          for pid in $pids; do wait "$pid" || { tail -50 together-*.log; exit 1; }; done
          wall() { python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['wall_s'])" "$1"; }
          for n in $gpus; do
            $ASSERT pinned "usage-alone-$n.json" cards.json "$n"
            $ASSERT pinned "usage-together-$n.json" cards.json "$n"
            for t in "alone-$n" "together-$n"; do
              $CHECK "$t.mp4" --ref src1080.mp4 --codec h265 --frames 900 --size 1920x1080 --min-psnr 30
            done
            $ASSERT faster "card $n alongside the others vs alone" "$(wall "usage-together-$n.json")" "$(wall "usage-alone-$n.json")" 1.15 | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the logs and the engine-time records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-gpu-logs
          path: |
            *.log
            usage-*.json
            devices.json
            cards.json
          if-no-files-found: ignore
