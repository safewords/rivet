name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`, and `safewords-runners-gpu` / `safewords-runners-gpu-x2`
# for the hardware jobs, each card held by one job at a time); nothing runs on
# GitHub-hosted runners. Pull requests from forks run there too, but only once
# a maintainer approves the run (the repository requires approval for every
# outside contributor), and never the GPU jobs. There are no arm64 jobs: the
# NEON kernels are checked by hand on ARM hardware (docs/testing.md, "NEON on
# ARM hardware").

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Linux tests: the groups of .github/ci/tests.sh (shared with the
  # codec repositories' cache warm-up, which builds the same things with
  # --no-run), folded into three jobs balanced by measured time. A runner
  # holds a whole ci node (one per node, five in all, shared by the org), so
  # each job uses every core of its machine and the three run side by side.
  # MSRV rides with the shortest.
  #
  # The compile cache: `ci-cache-setup` (in the runner image) points cargo at
  # sccache on the cluster's Garage (safewords/helm-charts ci-cache). Every
  # job reads it; only a trusted ref (a push or dispatch on develop or main)
  # writes it, decided by the cache's broker from the job's OIDC token, which
  # is what `id-token: write` is for. On a runner without the cache the
  # script says so and the job builds uncached.
  test:
    name: ${{ matrix.name }} (linux)
    runs-on: safewords-runners
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: audio, images, transcoder lib
            groups: audio images transcoder-lib
            deps: faad libdca-utils flac mkvtoolnix alacconvert
          - name: codec integration, end to end, MSRV
            groups: codec-tests transcoder-e2e
            deps: flac mkvtoolnix mediainfo alacconvert
            msrv: true
          - name: codec lib, video, AV1
            groups: codec-lib video av1
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (in parallel)
        run: .github/ci/submodules.sh
      - name: Black-box tools for these groups
        if: matrix.deps
        run: .github/ci/deps.sh ${{ matrix.deps }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests (${{ matrix.groups }})
        run: .github/ci/tests.sh ${{ matrix.groups }}
      # The workspace's rust-version: every crate, the submodules included,
      # builds at it. The tests run on stable, which moves.
      - if: matrix.msrv
        uses: dtolnay/rust-toolchain@1.99
      - name: MSRV (1.99) — check every crate and target
        if: matrix.msrv
        run: .github/ci/msrv.sh
      - name: Compile cache hits
        if: always()
        run: if command -v ci-cache-stats >/dev/null; then ci-cache-stats; fi

  # ---- Intel GPU (QSV) --------------------------------------------------
  # Real hardware: only for trusted refs (pushes, manual dispatches), never
  # for pull requests. Every card runs one job at a time: a runner holds its
  # cards exclusively (the device plugin's gpu.intel.com/i915; see the
  # safewords/runners README). Three Arc cards on two machines (devbox: an
  # A380 and an A750; vulpes-zerda: an A310):
  # - `safewords-runners-gpu` runners hold one card each, up to three at once, so
  #   the per-codec jobs run three at a time, one per card, on whichever
  #   machines the autoscaler powers on for them;
  # - `safewords-runners-gpu-x2` holds both of devbox's cards for gpu-scheduling,
  #   which runs after the per-codec jobs (so the cards are free) and one at
  #   a time. Its timing assertions are the only ones in the GPU jobs.
  # Each job reads its card count from `rivet devices --json`; the
  # multi-card checks say "skipped" when a job holds one card.
  #
  # The binaries are built once, on a CPU runner (safewords-runners: the same
  # Ubuntu 24.04 actions-runner base as the GPU runners, so the same glibc;
  # the Intel runtime is dlopened at run time),
  # and every GPU job downloads them.

  gpu-build:
    name: build the QSV binaries for the GPU jobs
    if: github.event_name != 'pull_request'
    runs-on: safewords-runners
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Build the CLI, the tools and the hardware tests with QSV
        run: |
          cargo build --release -p rivet-transcoder --features qsv --locked \
            --bin rivet --example synth_clip --example check_decode
          cargo test --release --features qsv --locked --no-run --message-format=json \
            -p rivet-transcoder --test cbr_rates > tests.json
          cargo test --release --features qsv --locked --no-run --message-format=json \
            -p rivet-codec --test qsv_vp9_encode --test hw_vpx_decode >> tests.json
          mkdir -p dist/tests
          cp target/release/rivet target/release/examples/synth_clip target/release/examples/check_decode dist/
          python3 - <<'PY'
          import json, shutil
          for line in open("tests.json"):
              m = json.loads(line)
              if m.get("reason") == "compiler-artifact" and m.get("executable") and "test" in m["target"]["kind"]:
                  shutil.copy(m["executable"], f"dist/tests/{m['target']['name']}")
                  print("test binary:", m["target"]["name"])
          PY
          tar -C dist -czf gpu-binaries.tgz .
          ls -l dist dist/tests
      - name: Compile cache hits
        if: always()
        run: if command -v ci-cache-stats >/dev/null; then ci-cache-stats; fi
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-binaries
          path: gpu-binaries.tgz
          retention-days: 3

  gpu-devices:
    name: rivet devices on a GPU node
    needs: gpu-build
    runs-on: safewords-runners-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpu-binaries
      - name: Every card of the host is detected, as an Intel card that encodes AV1, H.264 and H.265
        run: |
          mkdir -p bin && tar -C bin -xzf gpu-binaries.tgz
          ls -l /dev/dri
          for b in /sys/bus/pci/devices/*; do
            case "$(cat "$b/class")" in 0x03*) echo "$(basename "$b") vendor=$(cat "$b/vendor") device=$(cat "$b/device") subsystem=$(cat "$b/subsystem_vendor"):$(cat "$b/subsystem_device")";; esac
          done
          # The cards rivet must see: the ones this runner holds, whose render
          # nodes are in /dev/dri (sysfs lists the host's other cards too).
          want=$(ls /dev/dri | grep -c '^renderD')
          bin/rivet devices
          bin/rivet devices --json > devices.json
          python3 .github/scripts/multi_gpu_check.py devices devices.json cards.json | tee cards.txt
          grep -q "^cards=$want\$" cards.txt || { echo "rivet sees $(grep cards= cards.txt), /dev/dri has $want render node(s)"; exit 1; }
          { echo "Runner $(hostname): $want Intel card(s)"; grep '^gpu ' cards.txt; } >> "$GITHUB_STEP_SUMMARY"

  gpu-codec:
    # One job per codec, each on its own card (up to three at once across
    # the GPU machines), so a failure names its codec. QSV wires AV1, H.264,
    # H.265 and VP9, encode and decode, and nothing else (qsv_dec /
    # encode::qsv); MPEG-2, VP8, MPEG-4 Part 2, ProRes and JPEG are
    # software-only in rivet.
    name: ${{ matrix.codec }} on an Intel card (QSV)
    needs: gpu-build
    runs-on: safewords-runners-gpu
    strategy:
      fail-fast: false
      matrix:
        codec: [av1, h264, h265, vp9]
    env:
      NO_COLOR: "1"
      CODEC: ${{ matrix.codec }}
      RIVET: bin/rivet
      CHECK: bin/check_decode
      USAGE: python3 .github/scripts/drm_usage.py
      ASSERT: python3 .github/scripts/multi_gpu_check.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: gpu-binaries
      - name: Unpack, count the cards, make the sources
        id: cards
        run: |
          mkdir -p bin && tar -C bin -xzf gpu-binaries.tgz
          $RIVET devices --json > devices.json
          $ASSERT devices devices.json cards.json | tee devices.txt
          grep '^cards=' devices.txt >> "$GITHUB_OUTPUT"
          echo "gpus=$(python3 -c "import json; print(' '.join(sorted(json.load(open('cards.json')), key=int)))")" >> "$GITHUB_OUTPUT"
          # The card this job holds, by PCI address, with when it started:
          # the record that no two jobs ran on one card at once.
          grep '^gpu ' devices.txt | sed "s/^/$CODEC holds /" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$CODEC: started $(date -u +%FT%TZ) on runner $(hostname)" | tee -a "$GITHUB_STEP_SUMMARY"
          # A clean 720p clip, a noisy 720p clip (wants more than any rate
          # we hold it to), and a noisy 1080p clip for the ladders. Made by
          # rivet's own H.264 encoder.
          bin/synth_clip src720.mp4 --size 1280x720 --fps 30 --seconds 10
          bin/synth_clip noisy720.mp4 --size 1280x720 --fps 30 --seconds 6 --noise 10
          bin/synth_clip src1080.mp4 --size 1920x1080 --fps 30 --seconds 10 --noise 12 --bitrate 8000000

      - name: Encode on each card, pinned; the output decodes in rivet's software decoder
        # `--encode gpu:N --decode gpu:N`: the whole job on card N. The
        # kernel's per-client engine time (DRM fdinfo) must show card N busy
        # and no other card touched.
        env:
          GPUS: ${{ steps.cards.outputs.gpus }}
        run: |
          ext=mp4; [ "$CODEC" = vp9 ] && ext=webm
          for gpu in $GPUS; do
            out="enc-gpu$gpu.$ext"
            $USAGE "usage-enc-gpu$gpu.json" -- $RIVET transcode src720.mp4 -o "$out" --codec "$CODEC" \
              --rung 1280x720 --encode "gpu:$gpu" --decode "gpu:$gpu" 2> "enc-gpu$gpu.log" \
              || { tail -50 "enc-gpu$gpu.log"; exit 1; }
            $ASSERT pinned "usage-enc-gpu$gpu.json" cards.json "$gpu"
            $CHECK "$out" --ref src720.mp4 --codec "$CODEC" --frames 300 --size 1280x720 --min-psnr 30
          done

      - name: Decode on each card, bit-exact with rivet's software decoder
        # Every card's output decoded on every card's QSV decoder (no
        # software fallback): each frame identical to rivet's own decoder's.
        env:
          GPUS: ${{ steps.cards.outputs.gpus }}
        run: |
          ext=mp4; [ "$CODEC" = vp9 ] && ext=webm
          qsv=""; for gpu in $GPUS; do qsv="$qsv --qsv $gpu"; done
          for gpu in $GPUS; do $CHECK "enc-gpu$gpu.$ext" --codec "$CODEC" $qsv; done
          # H.264 also has a source that rivet's encoder wrote, not a GPU.
          if [ "$CODEC" = h264 ]; then $CHECK src1080.mp4 --codec h264 $qsv; fi

      - name: Constant rate holds on each card
        # 2 Mbit/s CBR with a 1 s buffer, pinned to each card: the average
        # within 10%, no one-second window over the rate plus the buffer.
        # Then an HLS rendition at that rate declares its BANDWIDTH.
        env:
          GPUS: ${{ steps.cards.outputs.gpus }}
        run: |
          ext=mp4; [ "$CODEC" = vp9 ] && ext=webm
          for gpu in $GPUS; do
            $RIVET transcode noisy720.mp4 -o "cbr-gpu$gpu.$ext" --codec "$CODEC" --rung 1280x720@2M \
              --rate-mode cbr --video-buffer 1s --encode "gpu:$gpu" --decode "gpu:$gpu" 2> "cbr-gpu$gpu.log" \
              || { tail -50 "cbr-gpu$gpu.log"; exit 1; }
            $CHECK "cbr-gpu$gpu.$ext" --codec "$CODEC" --frames 180 --rate 2000000 --buffer 1
          done
          $RIVET transcode noisy720.mp4 -o cbr-hls --mode hls --codec "$CODEC" --rung 1280x720@2M --rate-mode cbr \
            --encode family:intel 2> cbr-hls.log || { tail -50 cbr-hls.log; exit 1; }
          grep BANDWIDTH cbr-hls/master.m3u8

      - name: rivet's hardware tests for this codec
        # AV1 / H.264 / H.265: cbr_rates (the rate held through the job API,
        # and for H.264 an HLS rendition's BANDWIDTH). VP9: QSV encode
        # against rivet's VP9 decoder, and QSV decode of rivet's clips and the
        # WebM project's VP9 test vectors bit-exact through the VP9 guard.
        # Required here: a skip is a failure.
        env:
          RIVET_REQUIRE_QSV: "1"
          TRANSCODE_ENCODER_BACKEND: qsv
          RIVET_TEST_CODECS: ${{ matrix.codec }}
          RIVET_VPX_RAW_FEATURES: "1"
        run: |
          if [ "$CODEC" = vp9 ]; then
            crates/vp9/tools/fetch-vectors.sh
            export RIVET_VP9_VECTORS="$PWD/crates/vp9/tests/vectors"
            (cd crates/codec && ../../bin/tests/qsv_vp9_encode --nocapture --test-threads=1)
            (cd crates/codec && ../../bin/tests/hw_vpx_decode --nocapture --test-threads=1)
          else
            (cd crates/rivet && ../../bin/tests/cbr_rates --nocapture --test-threads=1)
          fi

      - name: A ladder on every card of the host, through the CLI
        # HLS and single-file, two rungs, `--encode family:intel`: on two or
        # more cards the chunks come from all of them (single-file output is
        # stitched from them). Every rendition decodes, every frame.
        env:
          CARDS: ${{ steps.cards.outputs.cards }}
        run: |
          $USAGE usage-hls.json -- $RIVET transcode src1080.mp4 -o hls --mode hls --codec "$CODEC" \
            --rung 1920x1080 --rung 1280x720 --encode family:intel 2> hls.log || { tail -50 hls.log; exit 1; }
          for p in $(find hls/video -name '*.m3u8' | sort); do $CHECK "$p" --codec "$CODEC" --frames 300; done
          ext=mp4; [ "$CODEC" = vp9 ] && ext=webm
          $USAGE usage-single.json -- $RIVET transcode src1080.mp4 -o single --codec "$CODEC" \
            --rung 1920x1080 --rung 1280x720 --encode family:intel 2> single.log || { tail -50 single.log; exit 1; }
          ls -l single
          test "$(ls single/*."$ext" | wc -l)" = 2
          for f in single/*."$ext"; do $CHECK "$f" --codec "$CODEC" --frames 300; done
          if [ "$CARDS" -lt 2 ]; then
            echo "multi-card: skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            $ASSERT all usage-hls.json cards.json
            $ASSERT chunks hls.log cards.json
            if grep -q "rung chunk done" single.log; then
              $ASSERT all usage-single.json cards.json
              $ASSERT chunks single.log cards.json
            else
              echo "single-file $CODEC took the serial path (one card); no stitch to check" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Keep the logs and the engine-time records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-codec-${{ matrix.codec }}-logs
          path: |
            *.log
            usage-*.json
            devices.json
            cards.json
          if-no-files-found: ignore

  gpu-scheduling:
    # Cross-card scheduling: a ladder on each card alone and on all of them,
    # the encode-bound case timed, and one job per card at once. The only
    # GPU job with timing assertions. Every per-card time is written to the
    # step summary and to scheduling.json (in the logs artifact).
    name: multi-GPU scheduling (both of devbox's Intel cards)
    # Its runner needs both of devbox's cards free at once, so it runs after
    # this run's per-codec jobs have let go of them (whatever they concluded:
    # a codec failure must not hide the scheduling results), and one at a
    # time across runs. The group is on this job, not the workflow: a
    # workflow-level group would also queue every run's per-codec jobs behind
    # the previous run, and GitHub cancels a queued member that a newer one
    # replaces, so a burst of pushes would lose whole runs instead of only
    # their scheduling job. A one-card job from another run can still hold a
    # devbox card for a while; the pod then waits for it.
    #
    # No other GPU work can share the cards while it runs, so no concurrency
    # group with the per-card jobs is needed (and one would cost: a group
    # runs one member and keeps one pending, cancelling the rest). The pod
    # requests gpu.intel.com/i915: 2 on devbox, which has exactly two, and
    # the device plugin runs with -shared-dev-num 1, so while it holds them
    # no other pod (safewords-runners-gpu, or another org's GPU runners,
    # all of which request i915) is given either card: per-card jobs queued
    # meanwhile run on vulpes-zerda's A310 or wait. Other pods can still
    # load devbox's CPU, which is what the interleaved timings are for.
    needs: [gpu-build, gpu-devices, gpu-codec]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.gpu-build.result == 'success' }}
    concurrency:
      group: safewords-runners-gpu-x2
      cancel-in-progress: false
    runs-on: safewords-runners-gpu-x2
    env:
      NO_COLOR: "1"
      RIVET: bin/rivet
      CHECK: bin/check_decode
      USAGE: python3 .github/scripts/drm_usage.py
      ASSERT: python3 .github/scripts/multi_gpu_check.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpu-binaries
      - name: Unpack, count the cards, make the source
        id: cards
        run: |
          mkdir -p bin && tar -C bin -xzf gpu-binaries.tgz
          $RIVET devices --json > devices.json
          $ASSERT devices devices.json cards.json | tee devices.txt
          grep '^cards=' devices.txt >> "$GITHUB_OUTPUT"
          echo "gpus=$(python3 -c "import json; print(' '.join(sorted(json.load(open('cards.json')), key=int)))")" >> "$GITHUB_OUTPUT"
          grep '^gpu ' devices.txt | sed "s/^/scheduling holds /" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "scheduling: started $(date -u +%FT%TZ) on runner $(hostname)" | tee -a "$GITHUB_STEP_SUMMARY"
          # This runner holds both of devbox's cards; fewer is a runner fault.
          grep -q '^cards=2$' devices.txt || { echo "expected 2 cards on the x2 runner: $(grep cards= devices.txt)"; exit 1; }
          bin/synth_clip src1080.mp4 --size 1920x1080 --fps 30 --seconds 30 --noise 6 --bitrate 20000000

      - name: A ladder spreads across every card
        # The same three-rung AV1 HLS ladder on each card alone and on all of
        # them (`--encode family:intel`, the default decode plan): on all,
        # chunks done on every card and every card's video engines busy.
        # Every rendition decodes; the full-size one close to the source.
        # devbox's A380 (PCIe 3.0 x2 behind the chipset) is 2-3.5x slower at
        # 1080p than its A750 (4.0 x16), and the work is split by speed — the
        # decode stays off a card far behind the fastest, and the tail of the
        # encode runs on the fast one (multigpu::speed). These runs are single
        # and only reported (scheduling.json); the timing judgement (at most
        # 0.95x the fastest card alone) is the interleaved best of three in
        # "Cards of different speeds share the work by speed".
        env:
          CARDS: ${{ steps.cards.outputs.cards }}
          GPUS: ${{ steps.cards.outputs.gpus }}
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          ladder="--mode hls --codec av1 --rung 1920x1080 --rung 1280x720 --rung 854x480"
          for plan in $(for g in $GPUS; do echo "gpu:$g"; done) family:intel; do
            tag="${plan/:/-}"
            $USAGE "usage-ladder-$tag.json" -- $RIVET transcode src1080.mp4 -o "ladder-$tag" $ladder --encode "$plan" \
              2> "ladder-$tag.log" || { tail -50 "ladder-$tag.log"; exit 1; }
            case "$plan" in gpu:*) $ASSERT pinned "usage-ladder-$tag.json" cards.json "${plan#gpu:}";; esac
            for p in $(find "ladder-$tag/video" -name '*.m3u8' | sort); do $CHECK "$p" --codec av1 --frames 900; done
          done
          $ASSERT all usage-ladder-family-intel.json cards.json
          $ASSERT chunks ladder-family-intel.log cards.json
          full=$(awk '/RESOLUTION=1920x1080/{getline; print; exit}' ladder-family-intel/master.m3u8)
          $CHECK "ladder-family-intel/$full" --ref src1080.mp4 --codec av1 --frames 900 --size 1920x1080 --min-psnr 30

      - name: When the encode is the bottleneck, every card does chunks
        # The encoders at `--video-speed archive` and the decode on the
        # fastest card, so the encode is the limit: pinned stays pinned, and
        # on all cards every card encodes. Timed (at most 0.85x the fastest
        # card alone; devbox: about 0.7x) in the interleaved runs of the
        # next step.
        env:
          CARDS: ${{ steps.cards.outputs.cards }}
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          fast=$(python3 -c "import json; c=json.load(open('cards.json')); print(min(c, key=lambda i: json.load(open(f'usage-ladder-gpu-{i}.json'))['wall_s']))")
          echo "the fastest card is $fast"
          for codec in av1 h265; do
            ladder="--mode hls --codec $codec --rung 1920x1080 --rung 1280x720 --rung 854x480 --video-speed archive --decode gpu:$fast"
            for plan in "gpu:$fast" family:intel; do
              tag="$codec-${plan/:/-}"
              $USAGE "usage-busy-$tag.json" -- $RIVET transcode src1080.mp4 -o "busy-$tag" $ladder --encode "$plan" \
                2> "busy-$tag.log" || { tail -50 "busy-$tag.log"; exit 1; }
            done
            $ASSERT pinned "usage-busy-$codec-gpu-$fast.json" cards.json "$fast"
            $ASSERT all "usage-busy-$codec-family-intel.json" cards.json
            $ASSERT chunks "busy-$codec-family-intel.log" cards.json
            for p in $(find "busy-$codec-family-intel/video" -name '*.m3u8' | sort); do $CHECK "$p" --codec "$codec" --frames 900; done
          done

      - name: Cards of different speeds share the work by speed
        # The timing assertions, all compared within this run: each card
        # alone and all of them together (decode auto and whole), three
        # rounds, every round running every plan in a rotated order, best of
        # the three (speed_aware_timings.py). A three-rung AV1 HLS ladder:
        # all cards at most 0.95x the fastest card alone. A one-rung H.265
        # single file of 10 s: at most 1.10x (one chunk: it encodes serially
        # on the fastest card). The same of 30 s: reported only. The ladder
        # at `--video-speed archive`, AV1 and H.265: at most 0.85x. Every
        # round's time, each plan's spread and the ratios go to the summary
        # and to speed_aware_timings.json.
        #
        # Then a 70 s rung through the chunk engine (four chunks), where a
        # card's encoder session is reset and reused for its next chunk, for
        # H.265, H.264 and AV1: every card that encodes builds one session
        # and reuses it. Which cards take chunks is the speed gate's call
        # and is not asserted here (the steps above assert the spread): for
        # H.264 the A750 encodes a chunk faster than the decode delivers the
        # next, so the gate rightly leaves the A380 out in some runs, and
        # the job is faster for it (devbox: 7.7 s against 8.1-8.7 s).
        env:
          CARDS: ${{ steps.cards.outputs.cards }}
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          bin/synth_clip src1080s.mp4 --size 1920x1080 --fps 30 --seconds 10 --noise 6 --bitrate 20000000
          python3 .github/scripts/speed_aware_timings.py $RIVET src1080.mp4 src1080s.mp4 --repeat 3
          bin/synth_clip src1080x.mp4 --size 1920x1080 --fps 30 --seconds 70 --noise 6 --bitrate 20000000
          for codec in h265 h264 av1; do
            $RIVET transcode src1080x.mp4 -o "reuse-$codec.mp4" --codec "$codec" --rung 1920x1080 --encode family:intel               2> "reuse-$codec.log" || { tail -60 "reuse-$codec.log"; exit 1; }
            $ASSERT reuse "reuse-$codec.log"
            $CHECK "reuse-$codec.mp4" --codec "$codec" --frames 2100
          done

      - name: One job per card, all at once
        # Independent jobs pinned to their own cards, side by side: each
        # stays on its card, every output decodes, and none is slowed by the
        # others (at most 1.15x its time alone; devbox: 0.96-1.00x). Three
        # rounds of alone-then-together; each card's best of three together
        # against its best of three alone, every round in the summary.
        env:
          CARDS: ${{ steps.cards.outputs.cards }}
          GPUS: ${{ steps.cards.outputs.gpus }}
        run: |
          if [ "$CARDS" -lt 2 ]; then echo "skipped: $CARDS card on this host" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          job() { $USAGE "usage-$2.json" -- $RIVET transcode src1080.mp4 -o "$2.mp4" --codec h265 --rung 1920x1080 \
                    --encode "gpu:$1" --decode "gpu:$1" 2> "$2.log"; }
          wall() { python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['wall_s'])" "$1"; }
          for round in 1 2 3; do
            for n in $GPUS; do job "$n" "alone-$n" || { tail -50 "alone-$n.log"; exit 1; }; done
            pids=""
            for n in $GPUS; do job "$n" "together-$n" & pids="$pids $!"; done
            for pid in $pids; do wait "$pid" || { tail -50 together-*.log; exit 1; }; done
            for n in $GPUS; do
              $ASSERT pinned "usage-alone-$n.json" cards.json "$n"
              $ASSERT pinned "usage-together-$n.json" cards.json "$n"
              for t in "alone-$n" "together-$n"; do
                [ "$round" = 1 ] && $CHECK "$t.mp4" --ref src1080.mp4 --codec h265 --frames 900 --size 1920x1080 --min-psnr 30
                wall "usage-$t.json" >> "walls-$t.txt"
              done
            done
          done
          for n in $GPUS; do
            echo "card $n alone: $(paste -sd' ' "walls-alone-$n.txt") s; alongside the others: $(paste -sd' ' "walls-together-$n.txt") s" | tee -a "$GITHUB_STEP_SUMMARY"
            $ASSERT faster "card $n alongside the others vs alone (best of 3)" \
              "$(sort -g "walls-together-$n.txt" | head -1)" "$(sort -g "walls-alone-$n.txt" | head -1)" 1.15
          done

      - name: Per-card timings
        if: always()
        run: |
          python3 .github/scripts/multi_gpu_check.py timings cards.json scheduling.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and the engine-time records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-scheduling-logs
          path: |
            *.log
            usage-*.json
            walls-*.txt
            speed_aware_timings.json
            scheduling.json
            devices.json
            cards.json
          if-no-files-found: ignore
