[workspace]
resolver = "2"
members = [
    "crates/frame",
    "crates/h26x",
    "crates/aac",
    "crates/ac3",
    "crates/dts",
    "crates/opus",
    "crates/mp3",
    "crates/vorbis",
    "crates/lossless",
    "crates/prores",
    "crates/vp8",
    "crates/vp9",
    "crates/mpeg2",
    "crates/mpeg4",
    "crates/av1",
    "crates/png",
    "crates/jpeg",
    "crates/webp",
    "crates/jpegxl",
    "crates/ndi",
    "crates/codec",
    "crates/container",
    "crates/rivet",
    "examples/yolo",
]
# rivet-imagecodecs (GIF, BMP, TIFF) is a workspace of its own, with a test
# kit beside the three codecs: its crates are path dependencies here, built
# and tested from its own root (`cargo test --manifest-path
# crates/imagecodecs/Cargo.toml`), not members of this workspace.
exclude = ["crates/imagecodecs"]

# GPU hardware codec FFI (NVENC/NVDEC, AMD AMF, Intel QSV/oneVPL) is hand-rolled
# in-tree (crates/codec/src/{encode,decode}/) — no external wrapper crates. The
# shiguredo_nvcodec / shiguredo_amf / shiguredo_vpl deps were all retired because
# they don't compile on Windows MSVC; our dlopen FFI builds on Windows + Linux.

[workspace.package]
version = "0.2.0"
edition = "2024"
# The minimum Rust every crate here builds with; CI holds it (the MSRV job).
rust-version = "1.99"
# Custom source-available license (not a standard SPDX id), so use license-file.
license-file = "LICENSE.md"
repository = "https://github.com/safewords/rivet"
authors = ["Ely Erin Fox"]

[workspace.dependencies]
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes              = "1"
mp4                = "0.14"
matroska-demuxer   = "0.7"
libloading         = "0.8"
tempfile           = "3"
criterion          = { version = "0.5", features = ["html_reports"] }
nvml-wrapper       = "0.10"
clap               = { version = "4", features = ["derive"] }
tokio              = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }

# Member crates. path = local build; version + package = crates.io publish
# (published as rivet-codec / rivet-container; imported as codec / container).
frame     = { path = "crates/frame", version = "0.2.0", package = "rivet-frame" }
h26x      = { path = "crates/h26x", version = "0.2.0", package = "rivet-h26x" }
aac       = { path = "crates/aac", version = "0.1.0", package = "rivet-aac" }
ac3       = { path = "crates/ac3", version = "0.1.0", package = "rivet-ac3", features = ["tracing"] }
dts       = { path = "crates/dts", version = "0.1.0", package = "rivet-dts" }
opus      = { path = "crates/opus", version = "0.1.0", package = "rivet-opus" }
mp3       = { path = "crates/mp3", version = "0.1.0", package = "rivet-mp3" }
vorbis    = { path = "crates/vorbis", version = "0.1.0", package = "rivet-vorbis" }
lossless  = { path = "crates/lossless", version = "0.1.0", package = "rivet-lossless" }
prores    = { path = "crates/prores", version = "0.1.0", package = "rivet-prores" }
vp8       = { path = "crates/vp8", version = "0.1.0", package = "rivet-vp8" }
vp9       = { path = "crates/vp9", version = "0.1.0", package = "rivet-vp9" }
mpeg2     = { path = "crates/mpeg2", version = "0.1.0", package = "rivet-mpeg2" }
mpeg4     = { path = "crates/mpeg4", version = "0.1.0", package = "rivet-mpeg4" }
av1       = { path = "crates/av1", version = "0.1.0", package = "rivet-av1" }
# Still-image codecs. The library names (`rpng`, `jpeg`, `gif`, `bmp`, `tiff`)
# are this workspace's own crates, not the crates.io ones of the same names,
# none of which is in the dependency tree.
rpng      = { path = "crates/png", version = "0.1.0", package = "rivet-png" }
jpeg      = { path = "crates/jpeg", version = "0.1.0", package = "rivet-jpeg" }
gif       = { path = "crates/imagecodecs/crates/rivet-gif", version = "0.1.0", package = "rivet-gif" }
bmp       = { path = "crates/imagecodecs/crates/rivet-bmp", version = "0.1.0", package = "rivet-bmp" }
tiff      = { path = "crates/imagecodecs/crates/rivet-tiff", version = "0.1.0", package = "rivet-tiff" }
webp      = { path = "crates/webp", version = "0.1.0", package = "rivet-webp" }
# JPEG XL input (`image` feature): a typed wrapper over jxl-rs, the JPEG XL
# project's own pure-Rust decoder (BSD-3-Clause); see NOTICE.
jpegxl    = { path = "crates/jpegxl", version = "0.1.0", package = "rivet-jpegxl" }
# NDI receive and send (rivet's `ndi` feature); the runtime is loaded at run time.
ndi       = { path = "crates/ndi", version = "0.1.0", package = "rivet-ndi" }
codec     = { path = "crates/codec", version = "0.2.0", package = "rivet-codec" }
container = { path = "crates/container", version = "0.2.0", package = "rivet-container" }

# Fully optimized release build. Fat LTO across all crates, single
# codegen unit, abort on panic (drops unwind tables). `strip =
# "debuginfo"` keeps symbol names so production panics resolve to
# function names.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
opt-level = 3

# Faster iteration build: release-class binary without the fat-LTO cost.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# rivet-tiff names rivet-png by its repository (it inflates and deflates with
# rpng's codec); this makes that the submodule here, so one copy is built.
[patch."https://github.com/safewords/rivet-png"]
rivet-png = { path = "crates/png" }
# rivet-webp codes its lossy frames with rivet-vp8, named by its repository:
# the submodule here, one copy.
[patch."https://github.com/safewords/rivet-vp8"]
rivet-vp8 = { path = "crates/vp8" }

# This workspace's own codecs optimised in dev and test builds (`test`
# inherits `dev`): a debug build of an AV1 or VP9 encoder, or of DEFLATE,
# runs one to two orders of magnitude slower, and the image and round-trip
# tests run them on every `cargo test`. Their own code is still checked in
# debug by each crate's CI.
[profile.dev.package.rivet-av1]
opt-level = 2
[profile.dev.package.rivet-vp9]
opt-level = 2
[profile.dev.package.rivet-png]
opt-level = 2
[profile.dev.package.rivet-jpeg]
opt-level = 2
[profile.dev.package.rivet-gif]
opt-level = 2
[profile.dev.package.rivet-tiff]
opt-level = 2
[profile.dev.package.rivet-webp]
opt-level = 2
[profile.dev.package.rivet-vp8]
opt-level = 2
