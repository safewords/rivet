[package]
name = "rivet-container"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "LICENSE.md"
readme = "README.md"
repository.workspace = true
authors.workspace = true
description = "Clean-room container demux (MP4/MKV/TS/AVI) and mux (AV1 MP4, CMAF, HLS) for the rivet transcoder, no FFmpeg. Imported as `container`."

[lib]
name = "container"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
mp4.workspace = true
matroska-demuxer.workspace = true
tempfile.workspace = true
frame.workspace = true
# The H.264 / HEVC SPS parsers, for the VUI colour description when an MP4
# carries no `colr` box.
h26x.workspace = true
# The Vorbis headers and Ogg pages (this workspace's own `crates/vorbis`): a
# Vorbis packet's duration follows from the block sizes its setup header
# declares, and the Ogg reader and writer frame Vorbis and Opus files.
vorbis.workspace = true

[dev-dependencies]
# Only the tests reach for a decoder; the library itself needs nothing from
# rivet-codec any more, which is what lets it build for wasm32.
codec.workspace = true
# H.263 baseline pictures (the MPEG-4 encoder's short video header) for the
# 3GP `s263` fixture, written in the test.
mpeg4.workspace = true

[lints.rust]
# `streaming_api_landed` is the post-merge gate flag for the
# streaming-migration #55 QA equality tests
# (`tests/streaming_equality.rs`). Tests are compile-excluded on
# this branch; flipped on at integration time via
# `RUSTFLAGS="--cfg streaming_api_landed"`. Registering the cfg here
# silences the rust 1.80+ `unexpected_cfgs` warning without affecting
# default behaviour.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(streaming_api_landed)'] }
